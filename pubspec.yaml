name: probashi_vote_hub
description: "Helper guide for Bangladeshi citizens abroad to prepare for postal voting."

publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Config for flutter_launcher_icons
flutter_launcher_icons:
  android: true          # generate Android launcher icon
  ios: false             # set to true if you add iOS later
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
